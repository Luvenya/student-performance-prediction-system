<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Risk Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1E2A3A;
    --bg: #FAF8F4;
    --panel: #FFFFFF;
    --line: #E4DED2;
    --muted: #6B6458;
    --low: #6B7F5C;
    --medium: #C88A3D;
    --high: #B54834;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }
  header {
    padding: 24px 40px 16px;
    border-bottom: 1px solid var(--line);
  }
  header h1 {
    font-family: 'Lora', serif;
    font-weight: 600;
    font-size: 24px;
    margin: 0 0 4px;
  }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .layout {
    display: grid;
    grid-template-columns: 400px 1fr;
    min-height: calc(100vh - 78px);
  }
  .list-panel {
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    max-height: calc(100vh - 78px);
  }
  .controls {
    padding: 16px 16px 12px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .controls input, .controls select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-family: inherit;
    font-size: 13px;
    background: var(--panel);
    color: var(--ink);
  }
  .controls .row { display: flex; gap: 8px; }
  .result-count {
    font-size: 12px;
    color: var(--muted);
    padding: 0 4px;
  }

  .list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .list-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    margin-bottom: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .list-item:hover { border-color: var(--ink); }
  .list-item.active { border-color: var(--ink); border-width: 1.5px; }
  .list-item .name { font-weight: 500; font-size: 13px; }
  .list-item .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 20px;
    color: #fff;
    white-space: nowrap;
  }
  .badge.Low { background: var(--low); }
  .badge.Medium { background: var(--medium); }
  .badge.High { background: var(--high); }
  .result-tag {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 4px;
    border: 1px solid var(--line);
    color: var(--muted);
  }

  .pagination {
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
  }
  .pagination button {
    padding: 6px 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 5px;
    cursor: pointer;
    font-size: 12px;
    color: var(--ink);
  }
  .pagination button:disabled { opacity: 0.4; cursor: not-allowed; }
  .pagination .page-info { color: var(--muted); }

  .detail { padding: 32px 48px; overflow-y: auto; }
  .detail .empty { color: var(--muted); font-style: italic; margin-top: 60px; }
  .detail h2 { font-family: 'Lora', serif; font-size: 24px; margin: 0 0 6px; }
  .detail .id { color: var(--muted); font-size: 13px; margin-bottom: 24px; }

  .metrics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 20px;
  }
  .metric {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .metric .label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
  .metric .value { font-size: 18px; font-weight: 600; }

  .result-compare {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-bottom: 28px;
  }
  .result-compare .metric .value { font-size: 20px; }
  .result-compare .metric.match { border-left: 3px solid var(--low); }
  .result-compare .metric.mismatch { border-left: 3px solid var(--high); }

  .rec-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--ink);
    border-radius: 4px;
    padding: 20px 22px;
  }
  .rec-box .label { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .rec-box p { margin: 0; line-height: 1.6; font-size: 15px; }

  .loading { color: var(--muted); font-size: 13px; padding: 16px; }
  .conn-error {
    margin: 16px;
    padding: 16px 20px;
    background: #FFF4F0;
    border: 1px solid var(--high);
    border-radius: 6px;
    color: var(--high);
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <h1>Academic Risk Dashboard</h1>
  <p id="headerSub">Student Performance Prediction System — Project 6 · OULAD dataset</p>
</header>

<div class="layout">
  <div class="list-panel">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by student ID…">
      <div class="row">
        <select id="riskFilter"><option value="">All risk levels</option></select>
        <select id="regionFilter"><option value="">All regions</option></select>
      </div>
      <div class="result-count" id="resultCount"></div>
    </div>
    <div class="list" id="studentList">
      <div class="loading">Loading students…</div>
    </div>
    <div class="pagination">
      <button id="prevBtn">&larr; Prev</button>
      <span class="page-info" id="pageInfo">–</span>
      <button id="nextBtn">Next &rarr;</button>
    </div>
  </div>
  <div class="detail" id="detail">
    <div class="empty">Select a student to view prediction details and recommendation.</div>
  </div>
</div>

<script>
const API_BASE = "http://127.0.0.1:5000";
const PER_PAGE = 50;

let state = { page: 1, search: "", risk: "", region: "" };

async function loadMeta() {
  try {
    const res = await fetch(`${API_BASE}/meta`);
    const meta = await res.json();

    document.getElementById("headerSub").textContent =
      `Student Performance Prediction System — Project 6 · ${meta.total_students.toLocaleString()} students (OULAD dataset)`;

    const riskSel = document.getElementById("riskFilter");
    meta.risk_levels.forEach(r => {
      const opt = document.createElement("option");
      opt.value = r; opt.textContent = r;
      riskSel.appendChild(opt);
    });

    const regionSel = document.getElementById("regionFilter");
    meta.regions.forEach(r => {
      const opt = document.createElement("option");
      opt.value = r; opt.textContent = r;
      regionSel.appendChild(opt);
    });
  } catch (err) {
    // silently ignore - filters just won't populate
  }
}

async function loadStudents() {
  const listEl = document.getElementById("studentList");
  listEl.innerHTML = `<div class="loading">Loading…</div>`;

  const params = new URLSearchParams({
    page: state.page,
    per_page: PER_PAGE,
    search: state.search,
    risk: state.risk,
    region: state.region,
  });

  try {
    const res = await fetch(`${API_BASE}/students?${params}`);
    if (!res.ok) throw new Error("Server error");
    const data = await res.json();

    document.getElementById("resultCount").textContent =
      `${data.total.toLocaleString()} students match`;
    document.getElementById("pageInfo").textContent =
      `Page ${data.page} of ${data.total_pages.toLocaleString()}`;
    document.getElementById("prevBtn").disabled = data.page <= 1;
    document.getElementById("nextBtn").disabled = data.page >= data.total_pages;

    listEl.innerHTML = "";
    if (data.students.length === 0) {
      listEl.innerHTML = `<div class="loading">No students match these filters.</div>`;
      return;
    }

    data.students.forEach(s => {
      const item = document.createElement("div");
      item.className = "list-item";
      item.dataset.id = s.student_id;
      item.innerHTML = `
        <div>
          <div class="name">Student ${s.student_id}</div>
          <div class="sub">${s.region} · ${s.studied_credits} credits</div>
        </div>
        <div style="display:flex; flex-direction:column; align-items:flex-end; gap:4px;">
          <span class="badge ${s.risk_level}">${s.risk_level}</span>
          <span class="result-tag">${s.predicted_result}</span>
        </div>
      `;
      item.addEventListener("click", () => selectStudent(s.student_id, item));
      listEl.appendChild(item);
    });
  } catch (err) {
    listEl.innerHTML = `
      <div class="conn-error">
        Can't reach the backend at ${API_BASE}.<br>
        Make sure <code>python app.py</code> is running.
      </div>`;
  }
}

async function selectStudent(id, itemEl) {
  document.querySelectorAll(".list-item").forEach(el => el.classList.remove("active"));
  itemEl.classList.add("active");

  const detailEl = document.getElementById("detail");
  detailEl.innerHTML = `<div class="loading">Generating recommendation…</div>`;

  try {
    const res = await fetch(`${API_BASE}/students/${id}`);
    const s = await res.json();
    const match = s.predicted_result === s.actual_result;

    detailEl.innerHTML = `
      <h2>Student ${s.student_id}</h2>
      <div class="id">${s.gender} · ${s.age_band} · ${s.region} · Risk level: <strong>${s.risk_level}</strong></div>

      <div class="result-compare">
        <div class="metric ${match ? 'match' : 'mismatch'}">
          <div class="label">Predicted Result</div>
          <div class="value">${s.predicted_result}</div>
        </div>
        <div class="metric ${match ? 'match' : 'mismatch'}">
          <div class="label">Actual Result (ground truth)</div>
          <div class="value">${s.actual_result}</div>
        </div>
      </div>

      <div class="metrics">
        <div class="metric"><div class="label">Highest Education</div><div class="value">${s.highest_education}</div></div>
        <div class="metric"><div class="label">Prev. Attempts</div><div class="value">${s.num_of_prev_attempts}</div></div>
        <div class="metric"><div class="label">Disability</div><div class="value">${s.disability}</div></div>
      </div>

      <div class="rec-box">
        <div class="label">Intervention Recommendation</div>
        <p>${s.recommendation}</p>
      </div>
    `;
  } catch (err) {
    detailEl.innerHTML = `<div class="conn-error">Failed to load student detail.</div>`;
  }
}

// --- event wiring ---
let searchTimeout;
document.getElementById("searchInput").addEventListener("input", (e) => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => {
    state.search = e.target.value.trim();
    state.page = 1;
    loadStudents();
  }, 300);
});

document.getElementById("riskFilter").addEventListener("change", (e) => {
  state.risk = e.target.value;
  state.page = 1;
  loadStudents();
});

document.getElementById("regionFilter").addEventListener("change", (e) => {
  state.region = e.target.value;
  state.page = 1;
  loadStudents();
});

document.getElementById("prevBtn").addEventListener("click", () => {
  if (state.page > 1) { state.page--; loadStudents(); }
});
document.getElementById("nextBtn").addEventListener("click", () => {
  state.page++; loadStudents();
});

loadMeta();
loadStudents();
</script>

</body>
</html>
